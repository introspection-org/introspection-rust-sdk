name: Publish to crates.io

run-name: "${{ inputs.version && format('Publish {0} {1}', inputs.package, inputs.version) || format('Publish {0}', github.ref_name) }}"

# introspection-sdk is tagged vX.Y.Z; the AAuth crates are tagged
# <crate>-vX.Y.Z by release-please's component tags.
on:
  push:
    tags:
      - "v*"
      - "aauth-protocol-v*"
      - "aauth-person-server-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to publish."
        required: true
        default: introspection-sdk
        type: choice
        options:
          - introspection-sdk
          - aauth-protocol
          - aauth-person-server
      version:
        description: "Version to publish (without v prefix). Defaults to tag name."
        required: false
        type: string

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Resolve version from tag ───────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve package and version
        id: resolve
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "${GITHUB_REF_NAME}" in
            aauth-protocol-v*) PACKAGE=aauth-protocol ;;
            aauth-person-server-v*) PACKAGE=aauth-person-server ;;
            *) PACKAGE="${INPUT_PACKAGE:-introspection-sdk}" ;;
          esac
          VERSION="${INPUT_VERSION}"
          if [ -z "${VERSION}" ]; then
            VERSION="${GITHUB_REF_NAME##*v}"
          fi
          if [ "${PACKAGE}" = introspection-sdk ]; then
            TAG="v${VERSION}"
          else
            TAG="${PACKAGE}-v${VERSION}"
          fi
          {
            echo "package=${PACKAGE}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Package: ${PACKAGE} ${VERSION} (${TAG})"

  # ── Lint & Test ────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    # Tag-push releases already passed ci.yml on the tagged commit. A manual
    # workflow_dispatch publish has no equivalent upstream gate, so retain the
    # full validation there without compiling every feature twice on releases.
    if: github.event_name == 'workflow_dispatch'
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  # ── Publish to crates.io ───────────────────────────────────────────
  publish:
    name: Publish ${{ needs.resolve-version.outputs.package }} ${{ needs.resolve-version.outputs.version }} to crates.io
    needs: [resolve-version, lint-and-test]
    if: |
      always() &&
      needs.resolve-version.result == 'success' &&
      (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Stamp version from tag
        if: needs.resolve-version.outputs.package == 'introspection-sdk'
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          sed -i "0,/^version = .*/s/^version = .*/version = \"${VERSION}\"/" crates/introspection-sdk/Cargo.toml
          # Both README snippets: the bare one and the { version = "…", features = […] } one.
          sed -i "s/introspection-sdk = \"[^\"]*\"/introspection-sdk = \"${VERSION}\"/g" README.md
          sed -i "s/introspection-sdk = { version = \"[^\"]*\"/introspection-sdk = { version = \"${VERSION}\"/g" README.md
          echo "Stamped crates/introspection-sdk/Cargo.toml and README.md with version ${VERSION}"

      # release-please tags aauth-protocol and aauth-person-server together,
      # and the server cannot be published until the protocol version it
      # depends on is in the index, so it retries for up to ten minutes.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE: ${{ needs.resolve-version.outputs.package }}
        run: |
          ATTEMPTS=1
          if [ "${PACKAGE}" = aauth-person-server ]; then ATTEMPTS=20; fi
          for attempt in $(seq "${ATTEMPTS}"); do
            if cargo publish -p "${PACKAGE}" --allow-dirty; then exit 0; fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then sleep 30; fi
          done
          exit 1

  # ── GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [resolve-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # release-please creates the tag *and* the release, and the tag push is
      # what triggers this workflow — so by the time it runs the release
      # normally already exists and `gh release create` fails the job with a
      # 422. The step still earns its place for a manual `workflow_dispatch`
      # publish, where nothing has created one. Same guard the JS SDK uses.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          if gh release view "${TAG}" --json tagName >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping creation."
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes
