name: Publish walk binary

# introspection-cloud's SDK walk pulls this from GHCR instead of compiling the
# walk, so it walks the released SDK. Never attached to a release or crates.io.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.47.0 (built with this workflow, not the tag's)"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish walk binary
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WALK_IMAGE: ghcr.io/introspection-org/introspection-rust-walk
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require a release tag
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1 ;; esac
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      # Debug info is most of its size (321 MB); stripped it is 68 MB and keeps
      # the symbols a backtrace names. A library commits no Cargo.lock, so the
      # build resolves one, as a downstream crate does; `--locked` cannot.
      - name: Build the walk binary
        run: |
          cargo build --features walk --bin introspection-walk
          mkdir -p walk
          strip --strip-debug -o walk/introspection-walk target/debug/introspection-walk
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the walk binary to GHCR
        working-directory: walk
        run: |
          version="${TAG#v}"
          revision="$(git rev-parse HEAD)"
          oras push "${WALK_IMAGE}:${version},latest" \
            --artifact-type application/vnd.introspection.walk.v1 \
            --annotation "org.opencontainers.image.version=${version}" \
            --annotation "org.opencontainers.image.revision=${revision}" \
            introspection-walk:application/octet-stream
