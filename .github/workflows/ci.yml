name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Both jobs above and below run --all-features only, so a lint or a doc
      # link that is fine there and broken on a REST-only install lands green.
      # That is not hypothetical: three intra-doc links pointed at items the
      # `otel` and `arrow` features gate away, and `cargo doc` on the default
      # install emitted five warnings that nothing here ever saw.
      - name: Run clippy (default features, REST only)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check rustdoc
        # Broken intra-doc links are invisible without this: nothing else in
        # CI runs rustdoc.
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check rustdoc (default features, REST only)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (all features)
        # --all-features, not --features testing: the `arrow` tests only ran
        # at publish time under the narrower flag.
        run: cargo test --all-features

      # The two combinations users actually install. Only --all-features was
      # ever built here, so a #[cfg] slip in either would land green.
      - name: Build (default features, REST only)
        run: cargo build --locked

      - name: Build (otel only)
        run: cargo build --locked --features otel
