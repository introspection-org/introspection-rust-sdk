[package]
name = "aauth-access-server"
description = "An AAuth Access Server: a resource's own policy in four-party access, redeeming Person Servers' token requests over plain http types"
readme = "README.md"
documentation = "https://docs.rs/aauth-access-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["reqwest"]
# The default fetcher for resource, agent provider, Person Server and R3 documents.
reqwest = ["aauth-protocol/client"]

[dependencies]
aauth-protocol = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The other parties of a four-party flow, for tests/federation.rs.
aauth-person-server = { path = "../aauth-person-server" }
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
