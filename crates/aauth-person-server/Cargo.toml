[package]
name = "aauth-person-server"
description = "An AAuth Person Server: missions, person and auth tokens, budgets and approvals, over plain http types"
readme = "README.md"
documentation = "https://docs.rs/aauth-person-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["reqwest"]
# The default fetcher for agent provider, resource and R3 documents.
reqwest = ["aauth-protocol/client"]

[dependencies]
aauth-protocol = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
percent-encoding = "2"
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The agent side, for tests/client.rs.
aauth-protocol = { workspace = true, features = ["client"] }
reqwest = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The example server's flags.
clap = { version = "4.5", features = ["derive", "env"] }
