[package]
name = "introspection-sdk"
version = "0.33.1"
edition.workspace = true
description = "Rust SDK for Introspection — continuously improve your AI systems with production feedback and frontier practices"
license.workspace = true
repository.workspace = true
keywords = ["ai", "llm", "opentelemetry", "otlp", "introspection"]
categories = ["development-tools", "api-bindings"]
readme = "../../README.md"

[lints]
workspace = true

# docs.rs builds with all features so intra-doc links to the
# `otel`-gated surface (IntrospectionLogs, IntrospectionSpanProcessor)
# resolve correctly.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default: REST-only client (runtimes / experiments / Runner / tasks / files).
# Add the `otel` feature for the OTLP exporter, `track` / `feedback` /
# `identify`, and the span processor.
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
# Optional Apache Arrow IPC decode for the runner-scoped Data-Plane telemetry
# reads (`conversations` / `events`). Off by default so REST-only installs
# don't pull the (heavy) Arrow dependency tree; enable to use the
# `list_arrow` variants that request the `application/vnd.apache.arrow.stream`
# response and decode it into `RecordBatch`es.
arrow = ["dep:arrow"]
testing = ["otel", "opentelemetry_sdk/testing"]
# Fail a response decode on any field the SDK does not model, listing every
# such field with its JSON path. Off by default, where an unknown field is
# ignored. The end-to-end walk runs with it (CI's `--all-features`), so a field
# the server added shows up as API drift.
strict-schema = ["dep:serde_ignored"]

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

# OpenTelemetry — gated by the `otel` feature so REST-only installs don't pull them.
opentelemetry = { version = "0.33.0", default-features = false, features = ["logs", "trace"], optional = true }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["rt-tokio", "logs", "trace"], optional = true }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["logs", "trace", "http-proto", "reqwest-blocking-client"], optional = true }

# HTTP client — async + multipart + streaming for the REST API; `blocking`
# is required by the OTLP `reqwest-blocking-client` exporter under the
# `otel` feature (the BatchSpanProcessor runs on a non-tokio thread).
# Pinned to 0.13 to match opentelemetry-otlp 0.32 (avoids a duplicate
# reqwest in the dep graph and the resulting HttpClient trait-bound
# mismatch).
# `gzip` makes the client advertise `Accept-Encoding: gzip` and decompress
# responses transparently — the DP gateway compresses JSON when offered
# (Arrow stream responses are never compressed and arrive unchanged).
percent-encoding = { workspace = true }
# `system-proxy` is what makes 0.13 honour HTTPS_PROXY / NO_PROXY; 0.12 did so
# unconditionally, and a client behind a corporate proxy otherwise never connects.
reqwest = { workspace = true, features = ["blocking", "multipart", "query", "stream", "rustls-native-certs", "gzip", "system-proxy"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# `skip_serializing_none` on the response types: a `None` is left out when a
# record serializes, the way the server leaves it out or sends `null`.
serde_with = { version = "3", default-features = false, features = ["macros"] }
# Reports the fields a decode ignored, for the `strict-schema` feature.
serde_ignored = { version = "0.1", optional = true }

# Utilities
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tracing = "0.1"
bytes = { workspace = true }
async-stream = "0.3"
mime_guess = "2"
fastrand = "2"

# Builder pattern support — used by `ClientConfig` (REST) and
# `IntrospectionLogs` (otel) builders alike.
derive_builder = "0.20"


# Optional: Apache Arrow IPC-stream decode for the telemetry reads (gated by
# the `arrow` feature). `ipc` alone keeps the dependency tree lean — no
# csv/json/prettyprint/pyarrow.
arrow = { version = "60", default-features = false, features = ["ipc"], optional = true }

# Streaming support (StreamExt)
futures = "0.3"

# `Retry-After` may carry an HTTP-date instead of delta-seconds, and RFC 9110
# admits three date formats. Zero further dependencies, and the JS and Python
# SDKs both understand the date form via their standard libraries.
httpdate = "1.0.3"

[dev-dependencies]
ring = "0.17"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# In-memory span / log exporters for the in-crate tests. As a dev-dependency
# they are available under every feature set, so `cargo test --features otel`
# builds the same tests as `--features testing`.
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["testing"] }
insta = { version = "1", features = ["json", "redactions"] }
# The round-trip test also fails on an unknown field that only ever arrives
# as `null`, which the diff cannot see.
serde_ignored = "0.1"
wiremock = "0.6"
flate2 = "1"
dotenvy = "0.15"
# The end-to-end walk (tests/walk): a forward proxy that replays the shared
# HAR recording, or records one, for every client the SDK builds.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
regex = "1"
base64 = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }

[[example]]
name = "connectors-slack"
path = "examples/api/connectors_slack.rs"

[[example]]
name = "connectors-pipedream"
path = "examples/api/connectors_pipedream.rs"

[[example]]
name = "connectors-custom-app"
path = "examples/api/connectors_custom_app.rs"

[[example]]
name = "runtimes"
path = "examples/api/runtimes.rs"

[[example]]
name = "native-email-code"
path = "examples/api/native_email_code.rs"

# These drive the OTel surface through the in-memory exporters, so they only
# compile with `testing`. Cargo cannot feature-gate an integration test from
# inside the file, so declare the requirement here: a plain `cargo test` skips
# them instead of failing to build.
[[test]]
name = "span_attributes_test"
path = "tests/span_attributes_test.rs"
required-features = ["testing"]

# Drives the span processor against a slow mock collector, so it needs the
# OTel surface for the same reason as the test above.
[[test]]
name = "export_timeout_test"
path = "tests/export_timeout_test.rs"
required-features = ["otel"]

# The end-to-end walk replays a recording that includes the Arrow reads, so
# it needs the decoder; CI runs `cargo test --all-features`.
[[test]]
name = "walk"
path = "tests/walk/main.rs"
required-features = ["arrow"]

# Linting configuration
# Run: cargo clippy -- -W clippy::all -W clippy::pedantic
# Or use: cargo clippy --all-targets -- -W warnings
